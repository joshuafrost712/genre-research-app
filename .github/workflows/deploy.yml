name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a new push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project Pages serve under /<repo>/, so build with that base. Override
      # VITE_BASE here if the repo is renamed.
      - run: npm run build
        env:
          VITE_BASE: /genre-research-app/
          # Google OAuth Web client id (public client identifier, not a secret —
          # it ships in the browser bundle). Set as a repo Actions variable so the
          # deployed app gains sign-in + cloud sync + teams. Leave the variable
          # unset to deploy the app fully local-only with no sign-in UI.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths; point it at
      # the app shell so deep links / refreshes resolve client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
