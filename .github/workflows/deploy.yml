name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a new push supersede an older run.
#
# TRAP, hit on 2026-08-06 and worth thirty minutes to whoever hits it next. A Pages
# deployment's id IS the commit sha, so once a deployment for a given sha reaches a
# cancelled state, every retry for that same sha ("Created deployment for <sha>",
# then "Deployment cancelled" about six seconds later) fails instantly. Re-running
# the failed job does not help, and neither does workflow_dispatch on the same ref.
#
# Two pushes in quick succession are enough to cause it: the second supersedes the
# first here, and if the survivor then times out waiting on Pages (it polls
# deployment_queued for ten minutes and aborts), its sha is burnt.
#
# The fix is a NEW commit, not a retry. Check https://www.githubstatus.com first to
# rule out a real Pages incident, then push something, even an empty commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project Pages serve under /<repo>/, so build with that base. Override
      # VITE_BASE here if the repo is renamed.
      - run: npm run build
        env:
          VITE_BASE: /genre-research-app/
          # Google OAuth Web client id (public client identifier, not a secret —
          # it ships in the browser bundle). Set as a repo Actions variable so the
          # deployed app gains sign-in + cloud sync + teams. Leave the variable
          # unset to deploy the app fully local-only with no sign-in UI.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Public Google Apps Script web-app URL for the in-app feedback sink
          # (see feedback/server/README.md). Set as a repo Actions variable so
          # deployed users can submit comments straight to your Sheet. Leave
          # unset and submissions fall back to downloading a markdown file.
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          # Supabase project for beta-tester sign-in (?beta=1). The anon key is a
          # public client identifier (RLS-gated) and ships in the browser bundle,
          # so both live in repo Actions variables, not secrets. Provision with
          # scripts/setup-supabase.sh. Leave unset and beta mode runs anonymous.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Public URL of the deployed `translate` Edge Function, which gives the
          # app instant (under two seconds) translation of the answers a team
          # types. The Anthropic key stays in Supabase secrets and never reaches
          # the browser, so only the function URL is needed here.
          #
          # Leave this variable unset and the app still works: the worksheet and
          # navigation are translated at build time, and a request to translate an
          # answer is QUEUED for the zero-cost Claude handoff on the Export page
          # instead of failing. Set it after
          # `supabase functions deploy translate`.
          VITE_TRANSLATE_URL: ${{ vars.VITE_TRANSLATE_URL }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths; point it at
      # the app shell so deep links / refreshes resolve client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 600000 (10 min). On 2026-08-06 four consecutive deploys were
          # accepted by Pages, moved to deployment_in_progress, and were still
          # in_progress when this action hit ten minutes. The action does not just
          # give up at that point, it CANCELS the deployment, so a Pages build that
          # is merely slow gets killed rather than finishing late. githubstatus.com
          # showed no incident and the build job passed in ~22s each time.
          #
          # Thirty minutes costs nothing on a good day, since the step returns as
          # soon as Pages reports success.
          timeout: 1800000
