<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Base-relative, NOT "./": Pages has no SPA rewrite, so a deep link like
         /worksheet/s1a is served this same file as 404.html, and "./icon.svg"
         then resolves against /worksheet/ and 404s. Vite rewrites a root-relative
         URL here to the configured base, which resolves from any depth. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Local Genres Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
